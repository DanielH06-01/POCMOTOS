<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Repuestos</title>
    <link rel="stylesheet" href="repuestos.css">
</head>

<body>
    <h1>Agregar Repuestos</h1>

    <form id="formRepuestos" class="form">
        <label>Modelo: </label>
        <input type="text" id="modelo" required>

        <label>Nombre del repuesto: </label>
        <input type="text" id="nombreRepuesto" required>

        <label>Precio: </label>
        <input type="number" id="precio" required>

        <button type="submit">Agregar</button>
    </form>

    <p id="mensaje"></p>

    <script src="./repuestos.js">

    </script>
</body>

</html>
